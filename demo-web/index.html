<!doctype html>
<html lang="mn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photobooth Camera System</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:25px;background:#111318;color:white;font-family:Arial,sans-serif}.container{max-width:1000px;margin:auto}h1{margin-bottom:5px}p{color:#bbb}.panel{background:#20232b;padding:22px;border-radius:14px;margin-top:20px}button,select{padding:13px 18px;border:0;border-radius:8px;font-size:15px;margin:4px}button{background:#4776ed;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}select{background:#333743;color:white}.cameras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.camera{padding:20px 5px;border-radius:9px;background:#363942;text-align:center;font-size:14px}.camera.ready{background:#126b4a}.camera.virtual{background:#3c5279}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px}.photo img{width:100%;display:block;border-radius:8px}.photo p{font-size:13px;margin:7px 0}#sessionId{overflow-wrap:anywhere;color:#93b4ff}#capture{width:100%;padding:20px;font-weight:bold;font-size:20px}#status{color:#b8d0ff}@media(max-width:600px){.cameras{grid-template-columns:repeat(2,minmax(0,1fr))}body{padding:12px}}
</style>
</head>
<body><div class="container">
<h1>Photobooth Camera System</h1><p>Sequential / Simultaneous / Hybrid Test Capture Controller</p>
<div class="panel"><h2>1. Create Session</h2>
<select id="mode"><option value="sequential">Sequential — 1 Phone / 8 Photos</option><option value="simultaneous">Simultaneous — 8 Phones / 1 Capture</option><option value="hybrid">Hybrid Test — Real + Virtual Cameras</option></select>
<div id="hybridSettings" style="display:none;margin-top:15px"><label for="realCount">Number of real phones: </label><select id="realCount"><option value="1">1 Phone + 7 Virtual</option><option value="2">2 Phones + 6 Virtual</option><option value="3" selected>3 Phones + 5 Virtual</option><option value="4">4 Phones + 4 Virtual</option><option value="5">5 Phones + 3 Virtual</option><option value="6">6 Phones + 2 Virtual</option><option value="7">7 Phones + 1 Virtual</option><option value="8">8 Phones + 0 Virtual</option></select></div>
<button id="create">Create Session</button><p>Session ID: <strong id="sessionId">Not created</strong></p><button id="copy" disabled>Copy Session ID</button></div>
<div class="panel"><h2>2. Connected Cameras</h2><div class="cameras" id="cameras"></div><p id="status">Create a session first</p></div>
<div class="panel"><h2>3. Capture</h2><button id="capture" disabled>CAPTURE</button><p id="progress">0 / 8 photos</p></div>
<div class="panel"><h2>4. Captured Photos</h2><div class="gallery" id="gallery"></div></div>
</div>
<script>
const API="https://photobooth-gmu1.onrender.com";
const WS_URL="wss://photobooth-gmu1.onrender.com";
let socket=null,sessionId="",mode="sequential",realCount=3,cameras=[],busy=false,completed=0;
const $=id=>document.getElementById(id);
$("mode").addEventListener("change",()=>{$("hybridSettings").style.display=$("mode").value==="hybrid"?"block":"none";});
function expectedCameras(){return mode==="sequential"?1:8;}
function maxCaptures(){return mode==="sequential"?8:1;}
function updateButton(){const count=expectedCameras();const ready=cameras.filter(c=>c.ready).length;$("capture").disabled=!socket||socket.readyState!==WebSocket.OPEN||busy||completed>=maxCaptures()||cameras.length!==count||ready!==count;$("capture").textContent=mode==="sequential"?`CAPTURE NEXT (${Math.min(completed+1,8)}/8)`:"CAPTURE ALL 8 CAMERAS";}
function renderCameras(){$("cameras").innerHTML="";for(let i=1;i<=expectedCameras();i++){const id=`CAM${i}`;const camera=cameras.find(c=>c.cameraId===id);const div=document.createElement("div");div.className="camera"+(camera?.ready?" ready":"")+(camera?.virtual?" virtual":"");div.textContent=`${id} — ${camera?.virtual?"VIRTUAL READY":camera?.ready?"REAL READY":camera?"BUSY":"OFFLINE"}`;$("cameras").appendChild(div);}updateButton();}
async function loadPhotos(){if(!sessionId)return;try{const response=await fetch(`${API}/sessions/${encodeURIComponent(sessionId)}/photos`);if(!response.ok)throw Error(`Photos HTTP ${response.status}`);const photos=await response.json();$("gallery").innerHTML="";for(const photo of photos){const div=document.createElement("div");div.className="photo";const img=document.createElement("img");img.src=API+photo.url;img.alt=`${photo.cameraId} photo`;const label=document.createElement("p");label.textContent=`${photo.cameraId} — Shot ${photo.shotNumber} (${photo.virtual?"Virtual":"Real"})`;div.append(img,label);$("gallery").appendChild(div);}$("progress").textContent=mode==="sequential"?`${completed} / 8 completed · ${photos.length} saved`:`${photos.length} / 8 photos saved`;}catch(error){$("status").textContent=`Gallery error: ${error.message}`;}}
$("create").onclick=async()=>{try{if(socket){socket.onclose=null;socket.close();socket=null;}$("create").disabled=true;mode=$("mode").value;realCount=Number($("realCount").value);const response=await fetch(`${API}/sessions`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode,...(mode==="hybrid"?{realCount}:{})})});if(!response.ok)throw Error(`Could not create session: ${await response.text()}`);const data=await response.json();sessionId=data.sessionId;cameras=[];busy=false;completed=0;$("sessionId").textContent=sessionId;$("copy").disabled=false;$("gallery").innerHTML="";$("status").textContent="Waiting for cameras...";renderCameras();await loadPhotos();const ws=new WebSocket(WS_URL);socket=ws;ws.onopen=()=>{ws.send(JSON.stringify({type:"JOIN",role:"controller",sessionId}));updateButton();};ws.onmessage=async event=>{let msg;try{msg=JSON.parse(event.data);}catch{return;}if(msg.type==="STATUS"){cameras=msg.cameras;busy=msg.busy;completed=msg.completed;renderCameras();await loadPhotos();}if(msg.type==="CAPTURE_STARTED"){busy=true;$("status").textContent=`Capturing shot ${msg.shotNumber}...`;updateButton();}if(msg.type==="PHOTO_SAVED"){ $("status").textContent=`Photo saved: ${msg.photo.cameraId}`;await loadPhotos();}if(msg.type==="CAPTURE_COMPLETED"){busy=false;completed=msg.shotNumber;$("status").textContent=`Capture completed: ${msg.received}/${msg.expected}`;await loadPhotos();updateButton();}if(msg.type==="CAPTURE_FAILED"){busy=false;$("status").textContent=`Capture failed: ${msg.message} (${msg.received}/${msg.expected})`;await loadPhotos();updateButton();}if(msg.type==="ERROR"){busy=false;$("status").textContent=msg.message;updateButton();}};ws.onclose=()=>{if(socket!==ws)return;cameras=[];busy=false;$("status").textContent="Controller disconnected";renderCameras();};ws.onerror=()=>{$("status").textContent="WebSocket connection error";};}catch(error){$("status").textContent=error.message;}finally{$("create").disabled=false;}};
$("capture").onclick=()=>{if(busy||$("capture").disabled)return;busy=true;updateButton();socket.send(JSON.stringify({type:mode==="sequential"?"CAPTURE_ONE":"CAPTURE_ALL"}));};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(sessionId);}catch{window.prompt("Copy Session ID:",sessionId);}};
renderCameras();
</script></body></html>
